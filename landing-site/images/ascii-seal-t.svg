<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none" shape-rendering="crispEdges">
  <defs>
    <filter id="seal-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Stamped Notches / Teeth -->
  <g fill="#E8E4D8" opacity="0.45">
    <!-- Top / Bottom / Left / Right teeth -->
    <rect x="195" y="10" width="10" height="14" />
    <rect x="195" y="376" width="10" height="14" />
    <rect x="10" y="195" width="14" height="10" />
    <rect x="376" y="195" width="14" height="10" />

    <!-- Corner / Octagonal teeth -->
    <rect x="65" y="65" width="12" height="12" />
    <rect x="323" y="65" width="12" height="12" />
    <rect x="65" y="323" width="12" height="12" />
    <rect x="323" y="323" width="12" height="12" />

    <rect x="125" y="30" width="8" height="10" />
    <rect x="267" y="30" width="8" height="10" />
    <rect x="125" y="360" width="8" height="10" />
    <rect x="267" y="360" width="8" height="10" />

    <rect x="30" y="125" width="10" height="8" />
    <rect x="30" y="267" width="10" height="8" />
    <rect x="360" y="125" width="10" height="8" />
    <rect x="360" y="267" width="10" height="8" />
  </g>

  <!-- Outer Double Medallion Rings -->
  <circle cx="200" cy="200" r="168" stroke="#E8E4D8" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6" />
  <circle cx="200" cy="200" r="154" stroke="#9EC7BB" stroke-width="1" opacity="0.4" />
  <circle cx="200" cy="200" r="138" stroke="#E8E4D8" stroke-width="1.5" />

  <!-- Perimeter Ring Text (Silkscreen style ASCII) -->
  <g fill="#E8E4D8" font-family="'IBM Plex Mono', monospace" font-size="8" letter-spacing="2" opacity="0.8">
    <text x="96" y="58">★ DETERMINISTIC RUNTIME ★</text>
    <text x="86" y="352">★ ZERO TELEMETRY PROOF ★</text>
  </g>

  <!-- Inner Octagon Grid & Stamped Lines -->
  <polygon points="200,75 288,112 325,200 288,288 200,325 112,288 75,200 112,112" stroke="#232320" stroke-width="2" fill="#12120F" fill-opacity="0.6" />
  <polygon points="200,85 280,118 315,200 280,282 200,315 120,282 85,200 120,118" stroke="#9EC7BB" stroke-width="1" stroke-dasharray="3 3" opacity="0.5" />

  <!-- Center Verification Checkmark Matrix -->
  <g fill="#D4F638" filter="url(#seal-glow)">
    <!-- Heavy pixelated checkmark mark -->
    <rect x="135" y="195" width="16" height="16" />
    <rect x="151" y="211" width="16" height="16" />
    <rect x="167" y="227" width="16" height="16" />
    <rect x="183" y="243" width="16" height="16" />
    <rect x="199" y="227" width="16" height="16" />
    <rect x="215" y="211" width="16" height="16" />
    <rect x="231" y="195" width="16" height="16" />
    <rect x="247" y="179" width="16" height="16" />
    <rect x="263" y="163" width="16" height="16" />
    <rect x="279" y="147" width="16" height="16" />

    <!-- Checkmark secondary layer -->
    <rect x="151" y="195" width="16" height="16" opacity="0.6" />
    <rect x="167" y="211" width="16" height="16" opacity="0.6" />
    <rect x="183" y="227" width="16" height="16" opacity="0.6" />
    <rect x="199" y="211" width="16" height="16" opacity="0.6" />
    <rect x="215" y="195" width="16" height="16" opacity="0.6" />
    <rect x="231" y="179" width="16" height="16" opacity="0.6" />
    <rect x="247" y="163" width="16" height="16" opacity="0.6" />
    <rect x="263" y="147" width="16" height="16" opacity="0.6" />
  </g>

  <!-- ASCII Seal Text Details -->
  <g fill="#E8E4D8" font-family="'IBM Plex Mono', monospace" font-size="7" opacity="0.75">
    <text x="142" y="130">SEAL // LOCAL-ONLY</text>
    <text x="135" y="278">LOOPBACK-LOCKED 127.0.0.1</text>
    <text x="166" y="292">EXIT CODE: 0</text>
  </g>

  <!-- Twinkle Corner Pixels -->
  <rect x="110" y="145" width="4" height="4" fill="#D4F638" />
  <rect x="290" y="255" width="4" height="4" fill="#D4F638" />
  <rect x="280" y="125" width="4" height="4" fill="#9EC7BB" />
  <rect x="115" y="265" width="4" height="4" fill="#FF4D2E" />
</svg>
