name: Stateproof Verification

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start Dev Server
        run: pnpm run dev &
      - name: Run Stateproof
        run: npx @stateproof-dev/cli run
      - name: Export Markdown Card
        run: npx @stateproof-dev/cli export --format md
